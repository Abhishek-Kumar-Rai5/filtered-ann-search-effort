# Vertical slice: reachability for ACORN-γ (Phase 4 sweeps) and ACORN-1.
experiment_name: structural_slice_reach
dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
manifest: results/structural/slice/manifest.yaml
k: 10
budgets: [10, 20, 40, 80, 160, 320, 640, 1280, 2560]
graphs:
  acorn_gamma:
    kind: acorn
    index_path: data/cache/phase4/acorn_g100_m32_mb64.index
    index_hash: "20b0dacd17007dd4"
    gamma: 100
    m: 32
    m_beta: 64
    sweep_dir: results/phase4/matrix/acorn
  acorn_1:
    kind: acorn
    index_path: data/cache/phase1/acorn_acorn_1_buildA.index
    index_hash: "d228d82803cf00cb"
    gamma: 1
    m: 32
    m_beta: 64
    sweep_dir: results/structural/slice/matrix_acorn1/acorn
output_dir: results/structural/slice/reach
