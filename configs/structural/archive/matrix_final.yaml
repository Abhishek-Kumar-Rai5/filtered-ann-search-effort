# Final structural study (docs/structural_design.md §4).
# Structural validation experiment: PRE, POST, ACORN-γ sweeps (copy of
# configs/phase4/matrix.yaml; conditions from the structural manifest).
# Phase 4 full matrix (docs/phase4_matrix.md section 1 -- frozen).
experiment_name: structural_final_matrix

dataset:
  base: data/sift/sift_base.fvecs      # all 1,000,000
  queries: data/sift/sift_query.fvecs  # all 10,000

search:
  k: 10
  gt_k: 11                 # ground-truth depth (tie detection)

selectivity: {min: 0.01, max: 1.0, levels: 6}

generator:                 # frozen Phase 3 generator, C = 1000 (section 6);
  cache_dir: data/cache/structural_final   # final attributes + verified GT
  manifest: results/structural/final/conditions/manifest.yaml

budgets: [10, 20, 40, 80, 160, 320, 640, 1280, 2560]

methods:
  postfilter:
    m: 32
    ef_construction: 40
    seed: 42
    build_threads: 1       # bit-reproducible graph
    overfetch_factor: 1.0  # round-1 fetch ceil(k/s)
    growth_factor: 2.0
    max_rounds: 10
    replay_queries: 200    # V5 replay audit per (condition, budget)
    replay_seed: 20261301
    reuse_inert_budgets: true   # b <= ceil(k/s) identical (validated vs Phase 4)
  acorn:
    gamma: 100             # frozen Phase 4 ACORN-γ (index in index_dir)
    m: 32
    m_beta: 64
    build_threads: 16
    audit_base: 20000      # V5 +1 audit prefix
    audit_queries: 50

query_subset: {count: 0, seed: 0, first_n: true}   # 0 = all queries
sweep_threads: 16

timing: {queries: 500, seed: 20261200, repeats: 3}

paths:
  index_dir: data/cache/phase4
  output_dir: results/structural/final/matrix
