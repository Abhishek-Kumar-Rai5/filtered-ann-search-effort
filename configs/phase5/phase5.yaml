experiment_name: phase5_predictor

inputs:
  matrix: results/phase4/matrix
  nscan: results/phase4/nscan
  features: results/phase5/features
  local_density: results/phase4/phase4_generator_full/local_density.csv

methods: [postfilter, acorn]
budgets: [10, 20, 40, 80, 160, 320, 640, 1280, 2560]
success_recall: 0.9
s_star: [0.90, 0.95, 0.99]

split: {seed: 20261500, train_queries: 5000}
cv: {folds: 5, seed: 20261501}

feature_sets:
  full: [s, rho_hat, centroid_dist, score_concentration]
  minus_proxy: [s, centroid_dist, score_concentration]
  s_only: [s]
  full_lid: [s, rho_hat, centroid_dist, score_concentration, lid]

models:
  lr: {C: 1.0, max_iter: 2000}
  tree_depths: [2, 3, 4]
tau_grid_step: 0.001

b1_hash_seed: 20261502

bootstrap: {seed: 20261503, resamples: 2000, resamples_spearman: 1000, ci: 0.95}

gate:
  min_saving: 0.10
  alpha: 0.01
  min_dsuccess_lb: -0.01

output_dir: results/phase5
