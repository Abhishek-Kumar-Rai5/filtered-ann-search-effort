# Phase 1 PRIMARY run: ACORN paper SIFT1M LCPS benchmark (section 7.3.1).
# Every value below is fixed in docs/phase1_acorn_repro.md (pre-registered).
experiment_name: phase1_acorn_sift1m_buildA_drawA

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  official_groundtruth: data/sift/sift_groundtruth.ivecs
  max_base: 0        # 0 = all 1,000,000
  max_queries: 0     # 0 = all 10,000, file order

attributes:          # paper 7.1.1: random int 1..12, equals(y)
  min: 1
  max: 12
  base_seed: 20261002
  query_seed: 20261003
  draw_label: A

index:
  build_label: A
  reuse_cached: true         # reuse if cached, else build. acorn_gamma build A
                             # was built in attempt 1 (killed); see deviation D2
  build_threads: 16
  methods:                   # efConstruction = ACORN default M*gamma
    - {name: acorn_gamma, gamma: 12, m: 32, m_beta: 64}
    - {name: acorn_1, gamma: 1, m: 32, m_beta: 64}

search:
  k: 10
  dense_efs: {from: 10, to: 200, step: 1}   # Table-3 crossing
  paper_efs: {from: 10, to: 800, step: 50}  # paper curve grid: 10..760

timing:
  threads: 16
  warmup_trials: 1
  trials: 50                 # paper: QPS averaged over 50 trials

checks:
  official_gt_check: true
  faiss_gt_crosscheck_queries: 200
  determinism_efs: [10, 60, 760]
  counter_check_efs: [10, 110, 760]
  reload_check: true

paths:
  cache_dir: data/cache/phase1
  output_dir: results/phase1
