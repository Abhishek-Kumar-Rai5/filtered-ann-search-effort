experiment_name: phase1_acorn_sift1m_buildA_drawB

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  official_groundtruth: data/sift/sift_groundtruth.ivecs
  max_base: 0
  max_queries: 0

attributes:
  min: 1
  max: 12
  base_seed: 20261102
  query_seed: 20261103
  draw_label: B

index:
  build_label: A
  reuse_cached: true
  build_threads: 16
  methods:
    - {name: acorn_gamma, gamma: 12, m: 32, m_beta: 64}
    - {name: acorn_1, gamma: 1, m: 32, m_beta: 64}

search:
  k: 10
  dense_efs: {from: 10, to: 200, step: 1}
  paper_efs: {from: 10, to: 800, step: 50}

timing:
  threads: 16
  warmup_trials: 1
  trials: 50

checks:
  official_gt_check: false
  faiss_gt_crosscheck_queries: 200
  determinism_efs: [10, 60, 760]
  counter_check_efs: [10, 110, 760]
  reload_check: false

paths:
  cache_dir: data/cache/phase1
  output_dir: results/phase1
