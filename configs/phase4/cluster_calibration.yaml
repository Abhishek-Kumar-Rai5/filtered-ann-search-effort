# Phase 4 step 1: cluster-granularity calibration (docs/phase4_matrix.md §2).
# Structural generator statistics only -- no search, no Phase 4 outcome.
experiment_name: phase4_cluster_calibration
mode: calibration

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  max_base: 0          # all 1,000,000
  max_queries: 0       # all 10,000

search:
  k: 10

selectivity: {min: 0.01, max: 1.0, levels: 6}
correlations: [random, clustered]

generator:             # Phase 3 seeds, unchanged
  random_seed: 20261010
  clustered:
    num_clusters: 0    # set per candidate below
    kmeans_iterations: 25
    kmeans_seed: 20261011
    max_points_per_centroid: 256
    order_seed: 20261012

calibration:
  candidates: [1000, 2000, 5000]

validation:
  local_density_k: [10, 100]
  homophily_mode: sampled      # exact N x N infeasible at N = 1e6
  homophily_sample: 20000
  homophily_k: 10
  homophily_seed: 20261013
  null_draws: 0                # unused in calibration
  null_seed: 20261100
  alpha_family: 0.01
  kappa_min: 0.20              # Phase 3 corrected floor (eligibility)

paths:
  output_dir: results/phase4
  cache_dir: data/cache/phase4
