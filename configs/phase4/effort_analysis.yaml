experiment_name: phase4_effort_analysis

inputs:
  matrix: results/phase4/matrix
  nscan: results/phase4/nscan
  local_density: results/phase4/phase4_generator_full/local_density.csv
  timing_audit: results/phase4/timing_audit/timing_rows.csv

oracle_target_recall: 0.9
local_density_k: [10, 100]
fixed_budget_fail_recall: 0.9

bootstrap:
